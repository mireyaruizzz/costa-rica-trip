<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osa Peninsula · Aug 17–25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --canopy:#1F3A2E;
    --canopy-light:#2E5443;
    --sand:#F1E7CE;
    --sand-deep:#E7D9B6;
    --scarlet:#C1432B;
    --gold:#E0A83F;
    --teal:#2E7D6B;
    --ink:#24261F;
    --ink-soft:#5B5A4E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; color:var(--canopy);}
  a{color:var(--scarlet);}

  /* Nav */
  nav{
    position:sticky; top:0; z-index:50;
    background:var(--canopy);
    display:flex; align-items:center;
    gap:4px;
    padding:0 12px;
    overflow-x:auto;
    white-space:nowrap;
  }
  nav a{
    color:#EDE3C8;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    text-decoration:none;
    padding:14px 12px;
    letter-spacing:0.03em;
    border-bottom:2px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  nav a:hover, nav a.active{
    color:var(--gold);
    border-bottom:2px solid var(--gold);
  }

  /* Hero */
  .hero{
    padding:72px 24px 56px;
    text-align:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(46,125,107,0.12), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(193,67,43,0.10), transparent 45%);
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    color:var(--teal);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .hero h1{
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.1;
    max-width:760px;
    margin:0 auto 16px;
  }
  .hero h1 em{font-style:italic; color:var(--scarlet);}
  .hero p{
    max-width:520px;
    margin:0 auto;
    color:var(--ink-soft);
    font-size:16px;
  }
  .hero .travelers{
    margin:22px auto 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--canopy);
    display:inline-block;
    padding:8px 18px;
    border:1px solid var(--sand-deep);
    border-radius:999px;
    background:#FBF6E8;
  }

  section{
    max-width:880px;
    margin:0 auto;
    padding:56px 24px;
    scroll-margin-top:56px;
  }
  section + section{border-top:1px solid var(--sand-deep);}

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:8px;
  }
  .section-title{
    font-size:28px;
    margin-bottom:28px;
  }

  /* Flight card */
  .flight-card{
    background:var(--canopy);
    color:#EDE3C8;
    border-radius:16px;
    padding:26px 28px 22px;
    position:relative;
    overflow:hidden;
  }
  .flight-card::before{
    content:'';
    position:absolute;
    top:0; right:0;
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(224,168,63,0.10), transparent 70%);
  }
  .flight-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
    padding-bottom:16px;
    border-bottom:1px solid rgba(237,227,200,0.15);
    position:relative;
  }
  .flight-airline{
    font-family:'Fraunces', serif;
    font-size:18px;
    font-weight:600;
    color:#F6EFDC;
  }
  .flight-airline .flight-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:400;
    color:#A9B9AC;
    margin-left:8px;
  }
  .flight-ref{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    color:var(--gold);
    background:rgba(224,168,63,0.14);
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }
  .flight-leg{
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
  }
  .flight-leg + .flight-leg{
    margin-top:6px;
    padding-top:16px;
    border-top:1px dashed rgba(237,227,200,0.14);
  }
  .flight-point{
    flex:0 0 auto;
    min-width:72px;
  }
  .flight-point.arrive{text-align:right;}
  .flight-point .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:23px;
    font-weight:500;
    color:#F6EFDC;
    line-height:1.1;
  }
  .flight-point .time{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--gold);
    margin-top:3px;
  }
  .flight-point .place{
    font-size:11px;
    color:#A9B9AC;
    margin-top:2px;
  }
  .flight-path{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    min-width:60px;
  }
  .flight-path .line{
    width:100%;
    height:0;
    border-top:2px dashed rgba(237,227,200,0.3);
    position:relative;
  }
  .flight-path .line::after{
    content:'✈';
    position:absolute;
    top:-9px; left:50%;
    transform:translateX(-50%);
    font-size:13px;
    color:var(--gold);
    background:var(--canopy);
    padding:0 4px;
  }
  .flight-path .duration{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:#A9B9AC;
    letter-spacing:0.03em;
  }
  .flight-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid rgba(237,227,200,0.15);
    position:relative;
  }
  .flight-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#C7D2C6;
    background:rgba(237,227,200,0.08);
    padding:5px 10px;
    border-radius:6px;
  }
  .ticket-note{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:14px;
  }

  /* Route trail */
  .trail{
    display:flex;
    align-items:flex-start;
    gap:0;
    margin-top:8px;
  }
  .trail-stop{flex:1; position:relative; text-align:center;}
  .trail-dot{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--scarlet);
    margin:0 auto 10px;
    position:relative;
    z-index:2;
  }
  .trail-line{
    position:absolute;
    top:6px; left:50%; right:-50%;
    height:2px;
    background:repeating-linear-gradient(to right, var(--teal) 0 6px, transparent 6px 12px);
    z-index:1;
  }
  .trail-stop:last-child .trail-line{display:none;}
  .trail-stop .name{font-weight:600; font-size:14.5px; margin-bottom:2px;}
  .trail-stop .dates{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);}

  /* Field guide cards */
  .stay-card{
    background:#FBF6E8;
    border:1px solid var(--sand-deep);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:22px;
  }
  .stay-card h3{font-size:20px; margin-bottom:4px;}
  .stay-card .stay-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .specimens{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:14px;
  }
  .specimen{
    border:1px solid var(--sand-deep);
    border-radius:8px;
    padding:14px 16px;
    background:var(--sand);
  }
  .specimen .fig{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--teal);
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .specimen .name{font-weight:600; font-size:14.5px; margin-bottom:4px;}
  .specimen .desc{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
  .specimen a{font-size:12.5px; text-decoration:none; font-weight:500;}
  .specimen a:hover{text-decoration:underline;}

  .day-plan{
    background:#FBF6E8;
    border:1px solid var(--sand-deep);
    border-radius:10px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .day-plan-row{
    display:flex;
    gap:16px;
    padding:16px 20px;
  }
  .day-plan-row + .day-plan-row{border-top:1px dashed var(--sand-deep);}
  .day-plan-date{
    flex:0 0 64px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--teal);
    padding-top:2px;
  }
  .day-plan-body{flex:1;}
  .day-plan-body .name{font-weight:600; font-size:15px; margin-bottom:3px;}
  .day-plan-body .desc{font-size:13.5px; color:var(--ink-soft);}
  .status-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    margin-top:8px;
  }
  .status-tag.needs-booking{background:rgba(193,67,43,0.12); color:var(--scarlet);}
  .status-tag.booked{background:rgba(46,125,107,0.14); color:var(--teal);}

  /* Logistics */
  .notebook{
    background:#FBF6E8;
    border:1px solid var(--sand-deep);
    border-radius:10px;
    padding:8px 24px;
  }
  .notebook li{
    list-style:none;
    padding:14px 0;
    border-bottom:1px dashed var(--sand-deep);
    display:flex;
    gap:12px;
    font-size:14.5px;
  }
  .notebook li:last-child{border-bottom:none;}
  .notebook .tick{
    width:16px; height:16px;
    border:1.5px solid var(--teal);
    border-radius:4px;
    flex-shrink:0;
    margin-top:2px;
  }
  .notebook b{color:var(--canopy);}

  .ledger{
    background:#FBF6E8;
    border:1px solid var(--sand-deep);
    border-radius:10px;
    overflow:hidden;
  }
  .ledger-group{padding:18px 24px;}
  .ledger-group + .ledger-group{border-top:1px solid var(--sand-deep);}
  .ledger-group h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:10px;
  }
  .ledger-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:6px 0;
    font-size:14px;
  }
  .ledger-row .item{color:var(--ink);}
  .ledger-row .amt{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .ledger-total{
    background:var(--canopy);
    color:#EDE3C8;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .ledger-total .label{font-family:'Fraunces', serif; font-size:17px;}
  .ledger-total .amt{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    color:var(--gold);
  }
  .budget-note{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
  }

  .compare-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:14px;
    margin-top:18px;
  }
  .compare-card{
    border:1px solid var(--sand-deep);
    border-radius:10px;
    padding:16px 18px;
    background:#FBF6E8;
    position:relative;
  }
  .compare-card.recommended{border:2px solid var(--scarlet);}
  .compare-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--scarlet);
    color:#FBF6E8;
    padding:2px 8px;
    border-radius:4px;
    margin-bottom:10px;
  }
  .compare-card h4{
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--canopy);
    margin-bottom:2px;
  }
  .compare-card .airport-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--teal);
    margin-bottom:12px;
  }
  .compare-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:5px 0;
    border-bottom:1px dashed var(--sand-deep);
  }
  .compare-row:last-child{border-bottom:none;}
  .compare-row .k{color:var(--ink-soft);}
  .compare-row .v{font-family:'IBM Plex Mono', monospace; color:var(--ink); text-align:right;}

  .math-block{
    background:var(--sand);
    border:1px
